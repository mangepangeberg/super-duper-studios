<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Duper</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main>
    <section class="hero-wrapper">
      
      <!-- Art Direction: Webbläsaren väljer automatiskt bild utifrån skärmbredd -->
      <picture class="hero-media">
        <!-- Desktop / Padda liggande: visas vid skärmar bredare än 768px -->
        <source media="(min-width: 768px)" srcset="assets/img/hero-desktop.jpg">
        <!-- Mobil / Padda stående: fallback för smalare skärmar -->
        <img src="assets/img/hero-mobile.jpg" alt="Super Duper trähus i skogsmiljö" class="hero-img">
      </picture>

      <!-- Transparent logotyp centrerad över bilden -->
      <div class="hero-overlay-content">
        <img src="assets/img/logo-superduper.png" alt="Super Duper Logo" class="hero-logo">
      </div>

    </section>
  </main>

</body>
</html>
