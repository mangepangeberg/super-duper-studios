<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primär SEO & Metadata -->
  <title>Super Duper – Moderna trähus och arkitektur</title>
  <meta name="description" content="Super Duper skapar hållbara, arkitektritade trähus anpassade för det nordiska landskapet. Utforska våra koncept och miljöer.">
  <meta name="author" content="Super Duper Studios">
  <link rel="canonical" href="https://www.superduperstudios.se/">

  <!-- Open Graph (Förhandsvisning vid delning) -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.superduperstudios.se/">
  <meta property="og:title" content="Super Duper – Moderna trähus och arkitektur">
  <meta property="og:description" content="Hållbara, arkitektritade trähus anpassade för det nordiska landskapet.">
  <meta property="og:image" content="https://www.superduperstudios.se/assets/img/hero-desktop.jpg">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Super Duper – Moderna trähus och arkitektur">
  <meta name="twitter:description" content="Hållbara, arkitektritade trähus anpassade för det nordiska landskapet.">
  <meta name="twitter:image" content="https://www.superduperstudios.se/assets/img/hero-desktop.jpg">

  <!-- Favicon & Stilark -->
  <link rel="icon" type="image/svg+xml" href="assets/img/logo-superduper.svg">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <main>
    <section class="hero-wrapper">
      
      <!-- Art Direction: Webbläsaren väljer automatiskt rätt bildkälla -->
      <picture class="hero-media">
        <source media="(min-width: 768px)" srcset="assets/img/hero-desktop.jpg">
        <img src="assets/img/hero-mobile.jpg" alt="Super Duper modernt trähus i naturskön miljö" class="hero-img">
      </picture>

      <!-- Vektorlogotyp centrerad över herobilden -->
      <div class="hero-overlay-content">
        <img src="assets/img/logo-superduper.svg" alt="Super Duper Logo" class="hero-logo">
      </div>

    </section>
  </main>

</body>
</html>
